self-hosted-runner:
  # GitHub-hosted labels that actionlint 1.7.12 doesn't know yet. Remove this file once Renovate brings in an
  # actionlint release that does.
  labels:
    - ubuntu-26.04
    - ubuntu-26.04-arm
paths:
  .github/workflows/ci.yml:
    ignore:
      # CI runs this repository's own actions with the same-repository `$/` syntax, so the lockfile covers the
      # actions they use. actionlint doesn't know it yet (rhysd/actionlint#711); remove this once it does.
      - 'specifying action "\$/'
