name: Release

on:
  release:
    types:
      - published

permissions: {}

jobs:
  update-major-tag:
    name: Update major version tag
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 5
    steps:
      - name: Point major version tag at release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ ! "$TAG" =~ ^v([0-9]+)\.[0-9]+\.[0-9]+$ ]]; then
            echo "::notice::Release tag '$TAG' is not a vX.Y.Z version; not updating a major version tag."
            exit 0
          fi
          major="v${BASH_REMATCH[1]}"

          # Don't move the major tag backwards when publishing a patch for an older minor version.
          latest=$(gh api --paginate "repos/$REPO/git/matching-refs/tags/$major." --jq '.[].ref' \
            | sed 's#^refs/tags/##' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)
          if [ "$latest" != "$TAG" ]; then
            echo "::notice::$TAG is not the latest $major release ($latest); leaving $major unchanged."
            exit 0
          fi

          sha=$(gh api "repos/$REPO/commits/$TAG" --jq .sha)
          if gh api "repos/$REPO/git/ref/tags/$major" --silent 2>/dev/null; then
            gh api -X PATCH "repos/$REPO/git/refs/tags/$major" -f sha="$sha" -F force=true --silent
          else
            gh api -X POST "repos/$REPO/git/refs" -f ref="refs/tags/$major" -f sha="$sha" --silent
          fi
          echo "::notice::Pointed $major at $TAG ($sha)."
